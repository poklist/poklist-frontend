name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      # Ratchet on pre-existing react-hooks/exhaustive-deps warnings; must be lowered, never raised
      - name: Lint
        run: npm run lint -- --max-warnings=27

      # Before build: unit tests are the fastest real failure signal in this job.
      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder-client-id
          NEXT_PUBLIC_SITE_URL: http://localhost:8080

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    env:
      E2E_ACCESS_TOKEN: ${{ secrets.E2E_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run deterministic E2E
        id: deterministic-e2e
        run: npx playwright test --project=mobile-chrome --project=mobile-safari

      - name: Run smoke E2E
        if: ${{ env.E2E_ACCESS_TOKEN != '' }}
        run: npx playwright test --project=smoke
        env:
          E2E_SMOKE_BASE_URL: ${{ secrets.E2E_SMOKE_BASE_URL }}
          E2E_SMOKE_USER_CODE: ${{ secrets.E2E_SMOKE_USER_CODE }}
          E2E_SMOKE_LIST_ID: ${{ secrets.E2E_SMOKE_LIST_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.E2E_SMOKE_API_BASE_URL }}

      # Gate the upload on the deterministic step's own outcome, not the job's
      # overall failure() status: the report is generated by the deterministic
      # E2E run and only contains mock-server URLs. If it were uploaded on any
      # job failure, a smoke-only failure would publish an artifact containing
      # navigated URLs and identifiers sourced from secrets (E2E_SMOKE_BASE_URL,
      # E2E_SMOKE_USER_CODE, E2E_SMOKE_LIST_ID, E2E_SMOKE_API_BASE_URL) — GitHub
      # masks secrets in logs but not in uploaded artifacts.
      - name: Upload Playwright report
        if: ${{ steps.deterministic-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
