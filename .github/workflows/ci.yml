name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      # Ratchet on pre-existing react-hooks/exhaustive-deps warnings; must be lowered, never raised
      - name: Lint
        run: npm run lint -- --max-warnings=27

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder-client-id
          NEXT_PUBLIC_SITE_URL: http://localhost:8080

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    env:
      E2E_ACCESS_TOKEN: ${{ secrets.E2E_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run deterministic E2E
        run: npx playwright test --project=mobile-chrome --project=mobile-safari

      - name: Run smoke E2E
        if: ${{ env.E2E_ACCESS_TOKEN != '' }}
        run: npx playwright test --project=smoke
        env:
          E2E_SMOKE_BASE_URL: ${{ secrets.E2E_SMOKE_BASE_URL }}
          E2E_SMOKE_USER_CODE: ${{ secrets.E2E_SMOKE_USER_CODE }}
          E2E_SMOKE_LIST_ID: ${{ secrets.E2E_SMOKE_LIST_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.E2E_SMOKE_API_BASE_URL }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
